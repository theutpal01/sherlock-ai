# Static frontend + /api reverse proxy to the backend container.
# The upstream goes through a variable (not a bare proxy_pass host) so
# nginx resolves `backend` lazily at request time via the compose
# network's embedded DNS — the server still starts (and serves static
# assets) even where that hostname doesn't exist.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    # SPA fallback — but never for API or versioned assets.
    location /api/ {
        # The backend routes are mounted at /cases and /sessions (without /api).
        rewrite ^/api/(.*)$ /$1 break;
        # Pass the rewritten path explicitly when the upstream uses a variable.
        proxy_pass $backend_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
